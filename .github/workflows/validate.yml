name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          MISSING=0
          for f in README.md LICENSE .gitignore CONTRIBUTING.md; do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 1 ] && exit 1
          echo "All required files present"
      - name: Validate JSON
        run: |
          for f in data/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "Valid: $f"
          done
